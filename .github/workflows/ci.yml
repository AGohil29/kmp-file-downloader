name: CI Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-14, windows-latest ]

    defaults:
      run:
        # Same shell everywhere so ./gradlew behaves identically on Windows.
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      # gradle/gradle-daemon-jvm.properties asks for JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Kotlin/Native toolchain (macOS only)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run Desktop & Common Tests (All OS)
        run: ./gradlew desktopTest --stacktrace

      - name: Run iOS Simulator Tests (macOS only)
        if: runner.os == 'macOS'
        run: ./gradlew iosSimulatorArm64Test --stacktrace

      # Lint, migration verification and the remaining checks only need to run once.
      - name: Run Static Checks (Linux only)
        if: runner.os == 'Linux'
        run: ./gradlew check --stacktrace

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore